name: Build AbyssProtection 26.3
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Fabric mod
        run: java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain build --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AbyssProtection-Fabric-26.3
          path: build/libs/*.jar
